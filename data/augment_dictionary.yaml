# =============================================================================
# augment_dictionary.yaml - kamus untuk augmentasi teks (HANYA data train)
#
# Setiap entri adalah SATU grup berisi istilah yang dianggap setara.
# Saat augmentasi, sebuah kata dalam kalimat dapat diganti dengan istilah lain
# dari grup yang sama (dipilih acak) -- sehingga muncul variasi gaya
# sehari-hari tanpa mengubah makna/label.
#
# Silakan tambah/ubah grup sesuai kebutuhan. Semua istilah ditulis huruf kecil.
# =============================================================================

